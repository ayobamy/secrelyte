name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_not_real
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  SUPABASE_SECRET_KEY: sb_secret_ci_placeholder_not_real

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_TARBALL_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_TARBALL_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf /tmp/gitleaks.tgz -C "${HOME}/.local/bin" gitleaks
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Secret scan
        run: bash scripts/check-gitleaks.sh

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.24.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (locked, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Next.js floor (CVE-2025-29927)
        run: pnpm check:next

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Crypto boundary
        run: pnpm check:crypto

      - name: ESLint libsodium boundary
        run: pnpm check:eslint-boundary

      - name: Unit tests
        run: pnpm test:unit

      - name: Crypto suite (100% branches)
        run: pnpm test:crypto

      - name: Dependency audit
        run: pnpm audit --audit-level=moderate

      - name: Build
        run: pnpm build

      - name: No secret key in the client bundle
        run: pnpm check:bundle

      - name: Playwright
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.24.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (locked, no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.116.0

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Start local Supabase
        run: supabase start

      - name: Reset and apply migrations
        run: supabase db reset --yes

      - name: Schema security assertions
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/verify-schema-security.sql

      - name: RLS suite (authenticated users, not the service key)
        run: supabase test db

      - name: consume_share parallel budget
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/test-consume-share-parallel.sh
